packages:
  - apps/*

# Native / postinstall dependencies explicitly allowed to run build scripts.
# pnpm 11 blocks dependency build scripts by default.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false # telemetry — intentionally blocked
  '@tailwindcss/oxide': true
  argon2: true
  cpu-features: false # optional native accelerator (ssh2) — pure-JS fallback
  esbuild: true
  prisma: true
  protobufjs: false # postinstall minification only
  ssh2: false # pure-JS fallback used by dockerode (testcontainers)
  unrs-resolver: true
  vue-demi: true
