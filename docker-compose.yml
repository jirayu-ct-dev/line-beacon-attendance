services:
  postgres:
    image: postgres:17-alpine
    container_name: line-beacon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-line_beacon_attendance}
    ports:
      # Host port 5437 (not 5432): machines with a natively installed PostgreSQL
      # already have 5432 occupied — connections would silently hit that server.
      - '5437:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-line_beacon_attendance}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
